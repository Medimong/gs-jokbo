<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="외과 족보">
<meta name="theme-color" content="#ffffff">
<title>외과학 실습족보 아카이브 v2</title>
<style>
:root{
  --ink:#16181d; --body:#2f333b; --mute:#7b818c; --line:#e3e5e9;
  --bg:#ffffff; --panel:#f7f8f9; --accent:#7a2230; --accent-soft:#f6eef0;
  --ok:#1f6b4a; --ok-soft:#eaf3ee; --no:#a03434; --no-soft:#f8eeee;
  --serif:'Noto Serif KR',ui-serif,Georgia,serif;
  --sans:Pretendard,'Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--body);background:var(--bg);
  font-size:15.5px;line-height:1.72;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(180%) blur(8px);z-index:30}
.head{display:flex;align-items:baseline;gap:16px;padding:18px 0 14px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.brand span{color:var(--accent)}
.subtle{font-size:12.5px;color:var(--mute)}
.spacer{flex:1}
.modes{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.modes button{font:inherit;font-size:13px;padding:5px 14px;border:0;background:none;color:var(--mute);cursor:pointer}
.modes button+button{border-left:1px solid var(--line)}
.modes button.on{background:var(--ink);color:#fff}
#q{font:inherit;font-size:13.5px;padding:6px 10px;border:1px solid var(--line);border-radius:2px;
  width:190px;background:var(--panel)}
#q:focus{outline:none;border-color:var(--ink);background:#fff}

nav.secs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav.secs::-webkit-scrollbar{display:none}
nav.secs button{font:inherit;font-size:13.5px;white-space:nowrap;padding:9px 13px;border:0;
  background:none;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.secs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.secs button b{font-weight:400;color:var(--mute);font-size:12px;margin-left:5px}

main{padding:26px 0 90px}
.secintro{margin:0 0 22px}
.secintro h1{font-family:var(--serif);font-size:23px;color:var(--ink);margin:0 0 4px;font-weight:600;letter-spacing:-.01em}
.secintro p{margin:0;font-size:13px;color:var(--mute)}

article.q{border-top:1px solid var(--line);padding:26px 0}
article.q:first-of-type{border-top:0}
.qhead{display:flex;align-items:center;gap:9px;margin-bottom:11px;flex-wrap:wrap}
.qno{font-family:var(--serif);font-size:13px;color:var(--accent);font-weight:600}
.badge{font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:2px;padding:1px 7px}
.badge.hot{color:var(--accent);border-color:#e8d6da;background:var(--accent-soft)}
.topic{font-size:12px;color:var(--mute)}
.topic.veiled{display:none}
.done{margin-left:auto;font-size:11.5px;color:var(--ok)}

.stem{color:var(--ink);font-size:15.5px;line-height:1.78;white-space:pre-wrap;margin-bottom:12px}
table.lab{border-collapse:collapse;font-size:13.5px;margin:12px 0;background:var(--panel);width:100%;max-width:640px}
table.lab td,table.lab th{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table.lab th{font-weight:600;color:var(--ink);background:#f0f1f3;width:38%}
.figs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.figs img{max-width:290px;max-height:250px;border:1px solid var(--line);cursor:zoom-in;background:var(--panel)}
.figs.masked img{filter:blur(9px);cursor:pointer}

ol.opts{list-style:none;margin:14px 0 0;padding:0;counter-reset:o}
ol.opts li{counter-increment:o;position:relative;padding:9px 12px 9px 40px;border:1px solid var(--line);
  margin-bottom:6px;border-radius:2px;cursor:pointer;background:#fff;transition:background .12s,border-color .12s}
ol.opts li::before{content:counter(o);position:absolute;left:13px;top:9px;font-family:var(--serif);
  font-size:13px;color:var(--mute);width:16px;text-align:center}
ol.opts li:hover{background:var(--panel)}
ol.opts li.picked-ok{border-color:#bcd9c9;background:var(--ok-soft)}
ol.opts li.picked-no{border-color:#e6c4c4;background:var(--no-soft)}
ol.opts li.reveal-ok{border-color:#bcd9c9}
ol.opts li.reveal-ok::before{color:var(--ok)}
ol.opts.locked li{cursor:default}
.mark{float:right;font-size:12px;font-weight:600;margin-left:10px}
.mark.ok{color:var(--ok)} .mark.no{color:var(--no)}

.expl{margin-top:16px;border-left:2px solid var(--accent);padding:2px 0 2px 16px;display:none}
.expl.show{display:block}
.expl h4{font-family:var(--serif);font-size:13.5px;color:var(--ink);margin:16px 0 5px;font-weight:600}
.expl h4:first-child{margin-top:2px}
.expl p{margin:0 0 8px}
.optnote{margin:0 0 7px;padding-left:22px;position:relative;font-size:14.5px}
.optnote b{position:absolute;left:0;top:0;font-family:var(--serif);font-weight:600;color:var(--mute);font-size:13px}
.optnote.isans b{color:var(--ok)}
.optnote.isans{color:var(--ink)}
.pearl{background:var(--panel);border:1px solid var(--line);padding:10px 13px;font-size:14.5px;color:var(--ink)}
.meta{margin-top:14px;font-size:12px;color:var(--mute);line-height:1.7}
.meta code{font-family:var(--sans);background:var(--panel);padding:1px 5px;border:1px solid var(--line)}
.flag{display:inline-block;font-size:11.5px;color:var(--accent);border:1px solid #e8d6da;
  background:var(--accent-soft);padding:1px 7px;margin:0 4px 4px 0}
.cbtn{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;border-bottom:1px solid #e0c8ce;
  padding:0 0 1px;cursor:pointer;margin-right:12px}

#lb{position:fixed;inset:0;background:rgba(18,20,24,.92);display:none;align-items:center;
  justify-content:center;z-index:60;cursor:zoom-out;padding:24px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%}

aside#cp{position:fixed;inset:0;width:100%;height:100%;background:#fff;
  transform:translateX(101%);transition:transform .22s ease;
  z-index:50;overflow-y:auto;padding:26px 30px 70px}
aside#cp>*{max-width:900px;margin-left:auto;margin-right:auto}
aside#cp .close{max-width:none}
aside#cp.on{transform:none}
aside#cp h2{font-family:var(--serif);font-size:20px;color:var(--ink);margin:0 0 3px;font-weight:600}
aside#cp .close{position:absolute;top:18px;right:24px;border:0;background:none;font-size:22px;
  color:var(--mute);cursor:pointer;line-height:1}
.cbody{margin-top:16px}
.cbody h3{font-family:var(--serif);font-size:15.5px;color:var(--ink);margin:22px 0 7px;font-weight:600;
  padding-bottom:4px;border-bottom:1px solid var(--line)}
.cbody p{margin:0 0 10px}
.cbody ul,.cbody ol{margin:0 0 10px;padding-left:20px}
.cbody li{margin-bottom:4px}
.cbody table{border-collapse:collapse;width:100%;font-size:13px;margin:12px 0}
.tscroll{margin:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.thint{display:none}
.scrollhint{font-size:11.5px;color:var(--mute);margin:-6px 0 10px}
.cbody th,.cbody td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.cbody th{background:var(--panel);color:var(--ink);font-weight:600;white-space:nowrap}
.cbody code{background:var(--panel);padding:1px 4px;font-size:12.5px}
.cbody strong{color:var(--ink)}
.empty{color:var(--mute);font-size:14px;padding:40px 0}
ol.flow{counter-reset:f;list-style:none;margin:14px 0;padding:0}
ol.flow>li{counter-increment:f;position:relative;padding:10px 14px 10px 44px;border:1px solid var(--line);
  border-radius:2px;margin-bottom:0;background:#fff}
ol.flow>li::before{content:counter(f);position:absolute;left:0;top:0;bottom:0;width:30px;
  background:var(--panel);border-right:1px solid var(--line);font-family:var(--serif);
  font-size:13px;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600}
ol.flow>li:not(:last-child){margin-bottom:22px}
ol.flow>li:not(:last-child)::after{content:'';position:absolute;left:15px;bottom:-18px;width:1px;
  height:14px;background:var(--line)}
ol.flow>li>ul{list-style:none;margin:8px 0 0;padding:0}
ol.flow>li>ul>li{position:relative;padding:4px 0 4px 16px;font-size:14px;color:var(--body)}
ol.flow>li>ul>li::before{content:'';position:absolute;left:2px;top:13px;width:8px;height:1px;background:var(--accent)}
.ccard{border-top:1px solid var(--line);padding:24px 0}
.ccard:first-child{border-top:0}
.ccard h2{font-family:var(--serif);font-size:19px;color:var(--ink);margin:0 0 4px;font-weight:600}
.ccard .csum{font-size:13.5px;color:var(--mute);margin:0 0 6px}
.ccard .proto{font-size:11.5px;color:var(--accent);margin-bottom:10px}
.ccard .proto span{border:1px solid #e8d6da;background:var(--accent-soft);padding:1px 7px;margin-right:5px}
.ccard details summary{cursor:pointer;font-size:13.5px;color:var(--accent);list-style:none;
  border-bottom:1px solid #e0c8ce;display:inline-block;padding-bottom:1px}
.ccard details summary::-webkit-details-marker{display:none}
.ccard details[open] summary{margin-bottom:6px}
footer{border-top:1px solid var(--line);padding:20px 0;font-size:12px;color:var(--mute)}
@media(max-width:820px){
  .wrap{padding:0 16px}
  body{font-size:15.5px}
  .head{padding:12px 0 10px;gap:10px}
  .brand{font-size:17px;width:100%;order:1}
  .subtle{order:3;font-size:12px}
  #q{order:2;flex:1;min-width:0;width:auto;font-size:16px;padding:8px 10px}
  .modes{order:4;width:100%}
  .modes button{flex:1;padding:10px 0;font-size:14px}
  nav.secs button{padding:11px 12px;font-size:14px}
  main{padding:18px 0 80px}
  .secintro h1{font-size:20px}
  article.q{padding:20px 0}
  .stem{font-size:16px;line-height:1.75}

  /* 선지는 손가락으로 누른다. 충분히 크게. */
  ol.opts li{padding:14px 12px 14px 42px;margin-bottom:8px;min-height:52px;
    display:flex;align-items:center;font-size:15.5px;-webkit-tap-highlight-color:transparent}
  ol.opts li::before{top:50%;transform:translateY(-50%)}
  .mark{margin-left:auto;float:none}

  .figs img{max-width:100%;max-height:none}

  /* 표는 감싸는 상자가 가로로 스크롤한다.
     표 자체를 block으로 바꾸면 머리행과 본문의 열 너비가 어긋나므로 표 구조는 유지한다. */
  .tscroll{width:calc(100% + 32px);margin:12px -16px;overflow-x:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .tscroll table{display:table;width:auto;min-width:100%;max-width:none;margin:0;
    font-size:13.5px;border-left:0;border-right:0}
  .tscroll th, .tscroll td{padding:9px 11px;white-space:normal;min-width:160px;vertical-align:top}
  .tscroll th:first-child, .tscroll td:first-child{position:sticky;left:0;z-index:2;
    background:var(--panel);box-shadow:1px 0 0 var(--line);min-width:116px;padding-left:16px}
  .tscroll thead th{background:#f0f1f3}
  .tscroll thead th:first-child{z-index:3}
  .tscroll td:last-child, .tscroll th:last-child{padding-right:16px}
  .thint{display:block;font-size:11.5px;color:var(--accent);margin:-6px 0 12px}

  .expl{padding-left:12px;margin-top:14px}
  .optnote{font-size:15px}
  .cbtn{font-size:14.5px;padding:6px 0;margin-right:14px}

  /* 정리 카드는 아래에서 올라오는 시트로 연다. 엄지로 닫기 쉽게. */
  aside#cp{width:100%;height:100%;inset:0;border-left:0;border-radius:0;
    transform:translateY(101%);padding:22px 16px 90px}
  aside#cp.on{transform:none}
  aside#cp::before{content:none}
  aside#cp .close{top:10px;right:12px;font-size:28px;padding:6px 12px}
  aside#cp h2{font-size:18px;padding-right:40px}
  .ccard h2{font-size:17px}
}
@media(max-width:400px){
  .wrap{padding:0 12px}
  table.lab, .cbody table{width:calc(100% + 24px);margin-left:-12px;margin-right:-12px}
  nav.secs button{padding:10px 9px;font-size:13.5px}
}

/* 퀴즈 한 문항 보기 */
.qprog{height:3px;background:var(--line);margin:0 0 20px;position:relative}
.qprog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .22s}
#qnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  backdrop-filter:saturate(180%) blur(8px);border-top:1px solid var(--line);z-index:40;display:none}
#qnav.on{display:block}
#qnav .navin{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;
  padding:10px 24px calc(10px + env(safe-area-inset-bottom))}
.navbtn{font:inherit;font-size:13.5px;padding:9px 16px;border:1px solid var(--line);background:#fff;
  color:var(--body);border-radius:2px;cursor:pointer;white-space:nowrap}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn.next{border-color:#c9ccd2}
#qnav.graded .navbtn.next{background:var(--ink);color:#fff;border-color:var(--ink)}
.navpos{flex:1;text-align:center;font-size:11.5px;color:var(--mute);line-height:1.35;min-width:0}
.navpos b{display:block;font-family:var(--serif);font-size:14px;color:var(--ink);font-weight:600}
.navhint{font-size:11.5px;color:var(--mute);margin-top:14px}
body.quizmode main{padding-bottom:120px}
@media(max-width:820px){
  #qnav .navin{padding:8px 16px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .navbtn{padding:13px 14px;font-size:14.5px;-webkit-tap-highlight-color:transparent}
  body.quizmode main{padding-bottom:132px}
  .navhint{display:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="head">
      <div class="brand">외과학 <span>실습족보</span> 아카이브</div>
      <div class="subtle" id="stat"></div>
      <div class="spacer"></div>
      <input id="q" type="search" placeholder="문항 검색">
      <div class="modes">
        <button data-mode="study" class="on">학습</button>
        <button data-mode="quiz">퀴즈</button>
        <button data-mode="wrong">오답</button>
        <button data-mode="concepts">정리</button>
      </div>
    </div>
    <nav class="secs" id="secs"></nav>
  </div>
</header>
<main class="wrap">
  <div class="secintro"><h1 id="secTitle"></h1><p id="secDesc"></p></div>
  <div id="list"></div>
</main>
<footer class="wrap"><span id="foot"></span></footer>
<div id="qnav"></div>
<div id="lb"><img alt=""></div>
<aside id="cp"><button class="close">&times;</button><div id="cpin"></div></aside>

<script src="../data.js?v=202609040409"></script>
<script>
const S = { sec: 'ALL', mode: 'study', q: '' };
const PROG = JSON.parse(localStorage.getItem('gs_prog') || '{}');
const save = () => localStorage.setItem('gs_prog', JSON.stringify(PROG));
const POS = JSON.parse(localStorage.getItem('gs_pos') || '{}');
const savePos = () => localStorage.setItem('gs_pos', JSON.stringify(POS));
const posKey = () => S.sec + (S.q ? '|' + S.q : '');
function getQi(total){ let i = POS[posKey()] || 0; if (i >= total || i < 0) i = 0; return i; }
function setQi(i){ POS[posKey()] = i; savePos(); }
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c;
  if (x !== undefined) n.textContent = x; return n; };

function visible() {
  let qs = DATA.questions;
  if (S.sec !== 'ALL') qs = qs.filter(q => q.section === S.sec);
  if (S.mode === 'wrong') qs = qs.filter(q => PROG[q.id] === 'wrong');
  if (S.q) { const k = S.q.toLowerCase();
    qs = qs.filter(q => (q.stem + q.options.join(' ') + (q.topic || '')).toLowerCase().includes(k)); }
  return qs;
}
function renderSecs() {
  const n = document.getElementById('secs'); n.innerHTML = '';
  const mk = (code, label, cnt) => {
    const b = el('button', S.sec === code ? 'on' : '', label);
    if (cnt !== undefined) { const s = el('b', '', cnt); b.appendChild(s); }
    b.onclick = () => { S.sec = code; render(); };
    return b;
  };
  n.appendChild(mk('ALL', '전체', DATA.questions.length));
  for (const s of DATA.meta.sections)
    n.appendChild(mk(s, s, DATA.questions.filter(q => q.section === s).length));
}
function optnote(q, i) {
  const p = el('p', 'optnote' + (q.answerKeys.includes(i + 1) ? ' isans' : ''));
  p.appendChild(el('b', '', String(i + 1)));
  p.appendChild(document.createTextNode(q.optnotes[String(i + 1)] || ''));
  return p;
}
function explBlock(q) {
  const d = el('div', 'expl'); const e = q.explanation || {};
  const add = (h, t) => { if (!t) return; d.appendChild(el('h4', '', h)); d.appendChild(el('p', '', t)); };
  add('접근', e.approach);
  if (e.approachTable?.length) {
    const t = el('table', 'lab');
    e.approachTable.forEach((r, ri) => { const tr = el('tr');
      r.forEach((c, i) => tr.appendChild(el(ri === 0 || i === 0 ? 'th' : 'td', '', c)));
      t.appendChild(tr); });
    d.appendChild(t);
  }
  add('정답 근거', e.correct);
  const mode = q.optnotes_mode || (q.optnotes && Object.keys(q.optnotes).length ? 'full' : 'none');
  if (mode !== 'none' && q.optnotes && Object.keys(q.optnotes).length) {
    d.appendChild(el('h4', '', '선지별 검토'));
    q.options.forEach((_, i) => { if (q.optnotes[String(i + 1)]) d.appendChild(optnote(q, i)); });
  }
  if (e.compare_note) add('갈림길', e.compare_note);
  if (e.pearl) { d.appendChild(el('h4', '', '정리')); d.appendChild(el('div', 'pearl', e.pearl)); }
  const cs = (e.concepts || []).filter(s => DATA.concepts[s]);
  if (cs.length) { d.appendChild(el('h4', '', '판단 기준'));
    const row = el('div');
    cs.forEach(s => { const c = DATA.concepts[s];
      const label = (c.protocol?.length ? c.protocol.join(', ') + ' — ' : '') + (c.title || s);
      const b = el('button', 'cbtn', label.replace(' — ', ' / '));
      b.onclick = () => openConcept(s); row.appendChild(b); });
    d.appendChild(row); }
  const m = el('div', 'meta');
  if (q.appearances?.length) m.appendChild(document.createTextNode('출제 ' + q.appearances.join(', ')));
  const flags = el('div');
  if (q.answer_changed) flags.appendChild(el('span', 'flag', '정답 정정: ' + q.answer_changed));
  if (q.stem_rewritten) flags.appendChild(el('span', 'flag', '발문 보완'));
  if (q.generated_options?.length) flags.appendChild(el('span', 'flag', '선지 보완 ' + q.generated_options.join(',') + '번'));
  if (q.answer_conflict) flags.appendChild(el('span', 'flag', '원본 답 불일치: ' + q.answer_conflict));
  if (q.source_notes) flags.appendChild(el('span', 'flag', q.source_notes));
  if (flags.childNodes.length) m.appendChild(flags);
  d.appendChild(m);
  return d;
}
function card(q, idx) {
  const a = el('article', 'q');
  const h = el('div', 'qhead');
  h.appendChild(el('span', 'qno', String(idx + 1)));
  h.appendChild(el('span', 'badge', q.section));
  if (q.examCount > 1) h.appendChild(el('span', 'badge hot', '출제 ' + q.examCount + '회'));
  let topicEl = null;
  if (q.topic) {
    topicEl = el('span', 'topic', q.topic);
    // 주제가 곧 진단명인 문항이 많다. 퀴즈에서는 채점 전까지 가린다.
    if (S.mode === 'quiz') topicEl.classList.add('veiled');
    h.appendChild(topicEl);
  }
  if (PROG[q.id] === 'ok') h.appendChild(el('span', 'done', '맞힘'));
  a.appendChild(h);
  a.appendChild(el('div', 'stem', q.stem));
  if (q.labTable?.length) {
    const t = el('table', 'lab');
    q.labTable.forEach(r => { const tr = el('tr');
      r.forEach((c, i) => { const cell = el(i === 0 && r.length > 1 ? 'th' : 'td', '', c); tr.appendChild(cell); });
      t.appendChild(tr); });
    a.appendChild(t);
  }
  if (q.images_final?.length) {
    const f = el('div', 'figs');
    q.images_final.forEach(src => { const i = el('img'); i.src = '../images/' + src; i.loading = 'lazy';
      i.onclick = () => { const lb = document.getElementById('lb');
        lb.querySelector('img').src = i.src; lb.classList.add('on'); };
      f.appendChild(i); });
    a.appendChild(f);
    // 그림에 정답이 적혀 있으면 풀기 전에는 가린다.
    // 가렸다는 안내는 두지 않는다. 안내 자체가 그림에 답이 있다는 힌트가 된다.
    if (q.crop_needed && S.mode === 'quiz') {
      f.classList.add('masked');
      a._unmask = () => { f.classList.remove('masked'); };
    }
  }
  const ol = el('ol', 'opts');
  const ex = explBlock(q);
  let picked = [];
  const need = q.answerKeys.length;
  q.options.forEach((o, i) => {
    const li = el('li', '', o);
    li.onclick = () => {
      if (ol.classList.contains('locked')) return;
      const n = i + 1;
      if (picked.includes(n)) return;
      picked.push(n);
      const good = q.answerKeys.includes(n);
      li.classList.add(good ? 'picked-ok' : 'picked-no');
      const m = el('span', 'mark ' + (good ? 'ok' : 'no'), good ? '정답' : '오답');
      li.appendChild(m);
      if (picked.length >= need || !good) {
        ol.classList.add('locked');
        q.answerKeys.forEach(k => ol.children[k - 1].classList.add('reveal-ok'));
        ex.classList.add('show');
        if (a._unmask) a._unmask();
        if (topicEl) topicEl.classList.remove('veiled');
        PROG[q.id] = picked.every(p => q.answerKeys.includes(p)) ? 'ok' : 'wrong';
        save();
        if (S.mode === 'quiz') afterGrade();
      }
    };
    ol.appendChild(li);
  });
  a.appendChild(ol);
  if (S.mode === 'study') {
    ol.classList.add('locked');
    q.answerKeys.forEach(k => ol.children[k - 1].classList.add('reveal-ok'));
    ex.classList.add('show');
  }
  a.appendChild(ex);
  return a;
}
function wrapTables(root) {
  if (!root) return;
  root.querySelectorAll('table').forEach(t => {
    if (t.parentElement && t.parentElement.classList.contains('tscroll')) return;
    const box = el('div', 'tscroll');
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
    // 화면 밖으로 넘치는 표에만 안내를 붙인다
    requestAnimationFrame(() => {
      if (box.scrollWidth - box.clientWidth > 8 && !box.nextElementSibling?.classList.contains('thint')) {
        const h = el('div', 'thint', '표를 옆으로 밀어서 본다.');
        box.parentNode.insertBefore(h, box.nextSibling);
      }
    });
  });
}
function openConcept(slug) {
  const c = DATA.concepts[slug]; if (!c) return;
  const box = document.getElementById('cpin'); box.innerHTML = '';
  box.appendChild(el('h2', '', c.title || slug));
  if (c.summary) box.appendChild(el('p', 'subtle', c.summary));
  const b = el('div', 'cbody'); b.innerHTML = c.body || '';
  box.appendChild(b); wrapTables(b);
  const qids = (c.questions || []);
  if (qids.length) {
    box.appendChild(el('h3', '', '이 개념을 쓰는 문항'));
    const row = el('div');
    qids.forEach(id => { const q = DATA.questions.find(x => x.id === id); if (!q) return;
      const btn = el('button', 'cbtn', (q.topic || q.section) + ' (출제 ' + (q.examCount || 1) + '회)');
      btn.onclick = () => jumpTo(id);
      row.appendChild(btn); });
    box.appendChild(row);
  }
  document.getElementById('cp').classList.add('on');
}
function renderConcepts() {
  const L = document.getElementById('list'); L.innerHTML = '';
  let list = Object.values(DATA.concepts);
  if (S.sec !== 'ALL') list = list.filter(c => c.section === S.sec);
  if (S.q) { const k = S.q.toLowerCase();
    list = list.filter(c => (c.title + c.summary + c.body).toLowerCase().includes(k)); }
  document.getElementById('secTitle').textContent = '정리';
  document.getElementById('secDesc').textContent =
    list.length + '개. 조건이 바뀌면 판단이 어떻게 달라지는지 표와 프로토콜로 모았다.';
  if (!list.length) { L.appendChild(el('div', 'empty', '해당하는 정리가 없다.')); return; }
  list.sort((a, b) => String(a.section).localeCompare(String(b.section)));
  for (const c of list) {
    const box = el('div', 'ccard');
    box.appendChild(el('h2', '', c.title || c.slug));
    if (c.summary) box.appendChild(el('p', 'csum', c.summary));
    if (c.protocol?.length) { const pr = el('div', 'proto');
      c.protocol.forEach(x => pr.appendChild(el('span', '', x))); box.appendChild(pr); }
    const det = el('details'); det.open = true;
    det.appendChild(el('summary', '', '본문 접기'));
    const body = el('div', 'cbody'); body.innerHTML = c.body || '';
    det.appendChild(body); box.appendChild(det); wrapTables(body);
    const qids = c.questions || [];
    if (qids.length) {
      const row = el('div'); row.style.marginTop = '10px';
      row.appendChild(el('span', 'subtle', '이 기준을 쓰는 문항  '));
      qids.forEach(id => { const q = DATA.questions.find(x => x.id === id); if (!q) return;
        const b = el('button', 'cbtn', (q.topic || q.section));
        b.onclick = () => jumpTo(id, 'study');
        row.appendChild(b); });
      box.appendChild(row);
    }
    L.appendChild(box);
  }
  wrapTables(L);
  window.scrollTo(0, 0);
}
function stats(qs) {
  let ok = 0, no = 0;
  qs.forEach(q => { const v = PROG[q.id]; if (v === 'ok') ok++; else if (v === 'wrong') no++; });
  return { ok, no, left: qs.length - ok - no };
}
function afterGrade() {
  const nav = document.getElementById('qnav');
  nav.classList.add('graded');
  const qs = visible(), st = stats(qs);
  const line = nav.querySelector('.navstat');
  if (line) line.textContent = '맞힘 ' + st.ok + ' · 틀림 ' + st.no + ' · 안 푼 ' + st.left;
  const bar = document.querySelector('.qprog i');
  if (bar) bar.style.width = ((st.ok + st.no) / qs.length * 100) + '%';
}
function renderNav(qs, i) {
  const nav = document.getElementById('qnav');
  nav.innerHTML = ''; nav.classList.remove('graded');
  const w = el('div', 'navin');
  const prev = el('button', 'navbtn', '이전');
  prev.disabled = i === 0;
  prev.onclick = () => { setQi(i - 1); render(); };
  const pos = el('div', 'navpos');
  pos.appendChild(el('b', '', (i + 1) + ' / ' + qs.length));
  const st = stats(qs);
  pos.appendChild(el('span', 'navstat', '맞힘 ' + st.ok + ' · 틀림 ' + st.no + ' · 안 푼 ' + st.left));
  const last = i === qs.length - 1;
  const next = el('button', 'navbtn next', last ? '처음으로' : '다음 문항');
  next.onclick = () => { setQi(last ? 0 : i + 1); render(); };
  w.appendChild(prev); w.appendChild(pos); w.appendChild(next);
  nav.appendChild(w); nav.classList.add('on');
}
function renderQuizOne(qs) {
  const L = document.getElementById('list'); L.innerHTML = '';
  const i = getQi(qs.length), q = qs[i], st = stats(qs);
  const prog = el('div', 'qprog');
  const fill = el('i'); fill.style.width = ((st.ok + st.no) / qs.length * 100) + '%';
  prog.appendChild(fill); L.appendChild(prog);
  L.appendChild(card(q, i));
  L.appendChild(el('div', 'navhint', '숫자키 1~5로 선지를 고르고, 좌우 방향키로 문항을 옮긴다.'));
  wrapTables(L);
  renderNav(qs, i);
  window.scrollTo(0, 0);
}
function syncModes() {
  document.querySelectorAll('.modes button').forEach(x =>
    x.classList.toggle('on', x.dataset.mode === S.mode));
  document.body.classList.toggle('quizmode', S.mode === 'quiz');
  if (S.mode !== 'quiz') document.getElementById('qnav').classList.remove('on');
}
function jumpTo(id, mode) {
  const q = DATA.questions.find(x => x.id === id); if (!q) return;
  document.getElementById('cp').classList.remove('on');
  if (mode) S.mode = mode;
  S.sec = q.section; S.q = ''; document.getElementById('q').value = '';
  syncModes();
  const idx = visible().findIndex(x => x.id === id);
  if (S.mode === 'quiz' && idx >= 0) setQi(idx);
  render();
  if (S.mode !== 'quiz' && idx >= 0) {
    const nodes = document.querySelectorAll('article.q');
    if (nodes[idx]) nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
function render() {
  renderSecs();
  syncModes();
  if (S.mode === 'concepts') return renderConcepts();
  const qs = visible();
  document.getElementById('secTitle').textContent =
    S.sec === 'ALL' ? '전체 문항' : (DATA.meta.sectionNames[S.sec] || S.sec);
  document.getElementById('secDesc').textContent =
    qs.length + '문항. ' + (S.mode === 'study' ? '정답과 해설이 함께 보인다.'
      : S.mode === 'quiz' ? '한 문항씩 푼다. 답을 고르면 채점하고 해설이 열린다.' : '틀린 문항만 모았다.');
  const L = document.getElementById('list'); L.innerHTML = '';
  if (!qs.length) { L.appendChild(el('div', 'empty', '해당하는 문항이 없다.')); 
    document.getElementById('qnav').classList.remove('on'); return; }
  if (S.mode === 'quiz') return renderQuizOne(qs);
  qs.forEach((q, i) => L.appendChild(card(q, i)));
  wrapTables(L);
  window.scrollTo(0, 0);
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.modes button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); S.mode = b.dataset.mode; render();
});
document.getElementById('q').oninput = e => { S.q = e.target.value.trim(); render(); };
document.addEventListener('keydown', e => {
  if (S.mode !== 'quiz') return;
  const t = e.target.tagName;
  if (t === 'INPUT' || t === 'TEXTAREA') return;
  if (document.getElementById('cp').classList.contains('on')) return;
  const qs = visible(); if (!qs.length) return;
  const i = getQi(qs.length);
  if (e.key === 'ArrowRight') { e.preventDefault(); if (i < qs.length - 1) { setQi(i + 1); render(); } }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (i > 0) { setQi(i - 1); render(); } }
  else if (e.key >= '1' && e.key <= '5') {
    const li = document.querySelectorAll('ol.opts li')[+e.key - 1];
    if (li) li.click();
  }
});
document.getElementById('lb').onclick = e => e.currentTarget.classList.remove('on');
document.querySelector('#cp .close').onclick = () => document.getElementById('cp').classList.remove('on');
document.addEventListener('keydown', e => { if (e.key === 'Escape') {
  document.getElementById('lb').classList.remove('on');
  document.getElementById('cp').classList.remove('on'); } });
document.getElementById('stat').textContent =
  DATA.meta.count + '문항 · ' + Object.keys(DATA.concepts).length + '개념 · v2';
document.getElementById('foot').textContent =
  '서울대학교 의과대학 외과학 실습족보 2022-2026 정리. 빌드 ' + DATA.meta.built +
  '. 해설은 표준 교과서와 진료지침을 근거로 재검토한 것이며 원본 복원본의 정답과 다를 수 있다.';
render();
</script>
